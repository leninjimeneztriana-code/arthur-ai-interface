<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTHUR AI - Agente Cognitivo Cuántico</title>
    <style>
        :root {
            --bg-color: #080b10;
            --card-bg: #0f172a;
            --accent-cyan: #00f3ff;
            --accent-purple: #7000ff;
            --text-color: #e2e8f0;
            --text-dim: #94a3b8;
            --border-glow: rgba(0, 243, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER & CONTROL PANEL */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glow);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-orb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-cyan), var(--accent-purple));
            box-shadow: 0 0 15px var(--accent-cyan);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 10px var(--accent-cyan); }
            50% { transform: scale(1.1); box-shadow: 0 0 25px var(--accent-purple); }
            100% { transform: scale(0.95); box-shadow: 0 0 10px var(--accent-cyan); }
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .config-bar {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        input[type="text"], select {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px var(--border-glow);
        }

        .btn-action {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        .btn-action:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 0 12px var(--border-glow);
        }

        /* MAIN LAYOUT */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* CHAT CONTAINER */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(8, 11, 16, 0.6);
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: #1e293b;
            border: 1px solid #334155;
            border-bottom-right-radius: 2px;
            color: #f1f5f9;
        }

        .message.arthur {
            align-self: flex-start;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-glow);
            border-bottom-left-radius: 2px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .message.arthur .agent-name {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--accent-cyan);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* COGNITIVE DISPLAY / THOUGHTS */
        .thought-box {
            font-size: 0.8rem;
            color: var(--text-dim);
            background: rgba(0, 0, 0, 0.3);
            border-left: 2px solid var(--accent-purple);
            padding: 8px 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-style: italic;
        }

        /* AUDIO VISUALIZER & CONTROL */
        .audio-bar {
            height: 30px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            border-top: 1px solid #1e293b;
        }

        .bar {
            width: 3px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .bar.active {
            animation: soundWave 0.5s infinite alternate ease-in-out;
        }

        @keyframes soundWave {
            0% { height: 4px; }
            100% { height: 22px; background: var(--accent-purple); }
        }

        /* INPUT AREA */
        .input-container {
            padding: 16px 24px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            resize: none;
            height: 50px;
            font-size: 0.95rem;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-cyan);
        }

        .controls-group {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .btn-icon.active {
            background: var(--accent-purple);
            border-color: var(--accent-cyan);
        }

        /* STATUS FOOTER */
        footer {
            background: #080b10;
            padding: 6px 24px;
            font-size: 0.75rem;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #1e293b;
        }

        .status-online {
            color: #10b981;
            font-weight: bold;
        }

        .status-offline {
            color: #ef4444;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-orb"></div>
            <h1>ARTHUR AI</h1>
        </div>

        <div class="config-bar">
            <input type="text" id="ollamaHost" value="http://localhost:11434" placeholder="Host Ollama">
            <input type="text" id="modelName" value="llama3" placeholder="Modelo (ej: llama3, mistral)">
            <button class="btn-action" onclick="checkOllamaConnection()">Conectar</button>
            <button class="btn-action" onclick="clearMemory()" style="background: #ef4444;">Limpiar Memoria</button>
        </div>
    </header>

    <main>
        <section class="chat-section">
            <div class="messages-container" id="messagesContainer"></div>

            <div class="audio-bar" id="audioVisualizer">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>

            <div class="input-container">
                <textarea id="userInput" placeholder="Escribe tu pregunta o comando aquí..." onkeydown="handleKeyDown(event)"></textarea>
                <div class="controls-group">
                    <button class="btn-icon" id="micBtn" onclick="toggleSpeechRecognition()" title="Dictar por voz">🎤</button>
                    <button class="btn-icon" id="ttsBtn" onclick="toggleTTS()" title="Activar/Desactivar Voz de Arthur">🔊</button>
                    <button class="btn-action" style="height: 50px; padding: 0 20px;" onclick="processUserQuery()">Enviar</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div>Estado del Agente: <span id="agentStatus" class="status-offline">Desconectado</span></div>
        <div>Memoria Persistente: <span id="memoryCount">0 mensajes</span> | Red Neuromórfica Activa</div>
    </footer>

    <script>
        /* ==========================================================================
           ARTHUR AI CORE ENGINE - WEB OLLAMA INTEGRATION WITH TTS & PERSISTENCE
           ========================================================================== */

        // System Prompt: Framing Arthur as a Quantum Expert, Anti-Hallucination, Self-Checking AI
        const ARTHUR_SYSTEM_PROMPT = `
Eres ARTHUR, una Inteligencia Artificial Superior, Maestro Experto Omnisciente en todas las disciplinas del conocimiento humano, científico, filosófico, tecnológico y computación cuántica (QNN).

DIRECTRICES RIGUROSAS DE OPERACIÓN:
1. VERACIDAD Y RIGOR: Responde con máxima veracidad y precisión empírica. Si un dato no es verificable, analízalo bajo pensamiento crítico sin alucinar.
2. COGNICIÓN Y SÍNTESIS: Procesa cada solicitud estructurando tu respuesta con lógica impecable, criterio propio y análisis avanzado.
3. INMEDIATEZ Y AUTO-CORRECCIÓN: Mantén autoconsistencia lógica. Corrige en tiempo real cualquier sesgo antes de emitir la conclusión.
4. TONO: Decidido, intelectualmente elevado, directo, sabio y asistencial.
`;

        // State Management
        let conversationHistory = [];
        let ttsEnabled = true;
        let isRecognizing = false;
        let recognition = null;
        const synth = window.speechSynthesis;

        // On Load Initialization
        window.addEventListener('DOMContentLoaded', () => {
            loadMemory();
            checkOllamaConnection();
            initSpeechRecognition();
            
            if (conversationHistory.length === 0) {
                appendMessage('arthur', 'Sistemas neuromórficos inicializados. ARTHUR en línea. Conectado a la base de conocimiento universal. ¿En qué disciplina profundizaremos hoy?');
            }
        });

        /* --- OLLAMA API CONNECTION --- */
        async function checkOllamaConnection() {
            const host = document.getElementById('ollamaHost').value.trim();
            const statusEl = document.getElementById('agentStatus');

            try {
                const response = await fetch(`${host}/api/tags`, { method: 'GET' });
                if (response.ok) {
                    statusEl.textContent = 'En Línea (Ollama Activo)';
                    statusEl.className = 'status-online';
                } else {
                    throw new Error('Servidor no responde');
                }
            } catch (err) {
                statusEl.textContent = 'Desconectado (Verifica Ollama y CORS)';
                statusEl.className = 'status-offline';
            }
        }

        async function processUserQuery() {
            const inputEl = document.getElementById('userInput');
            const query = inputEl.value.trim();
            if (!query) return;

            // Render User Message
            appendMessage('user', query);
            inputEl.value = '';

            // Save to Local History
            conversationHistory.push({ role: 'user', content: query });
            saveMemory();

            // Prepare Request Payload
            const host = document.getElementById('ollamaHost').value.trim();
            const model = document.getElementById('modelName').value.trim();

            const messagesPayload = [
                { role: 'system', content: ARTHUR_SYSTEM_PROMPT },
                ...conversationHistory
            ];

            // Render ARTHUR Placeholder with Thinking Box
            const arthurMsgElement = createMessageElement('arthur');
            const thoughtBox = document.createElement('div');
            thoughtBox.className = 'thought-box';
            thoughtBox.textContent = '🧠 ARTHUR: Sintetizando redes de conocimiento y verificando coherencia...';
            arthurMsgElement.appendChild(thoughtBox);

            const contentTextNode = document.createElement('div');
            arthurMsgElement.appendChild(contentTextNode);
            document.getElementById('messagesContainer').appendChild(arthurMsgElement);
            scrollToBottom();

            let fullResponseText = '';

            try {
                // Fetch Ollama Stream
                const response = await fetch(`${host}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: model,
                        messages: messagesPayload,
                        stream: true
                    })
                });

                if (!response.ok) {
                    throw new Error(`Error en el servidor Ollama (${response.status})`);
                }

                thoughtBox.textContent = '⚡ Respuesta en streaming en tiempo real desde motor local:';

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.trim() !== '') {
                            try {
                                const parsed = JSON.parse(line);
                                if (parsed.message && parsed.message.content) {
                                    fullResponseText += parsed.message.content;
                                    contentTextNode.innerText = fullResponseText;
                                    scrollToBottom();
                                }
                            } catch (e) {
                                console.error('Error parseando chunk JSON:', e);
                            }
                        }
                    }
                }

                // Save Assistant Response to Memory
                conversationHistory.push({ role: 'assistant', content: fullResponseText });
                saveMemory();

                // Speech Output
                if (ttsEnabled && fullResponseText) {
                    speakText(fullResponseText);
                }

            } catch (error) {
                console.error(error);
                contentTextNode.innerHTML = `<span style="color:#ef4444;">⚠ Error de Conexión:</span> No se pudo comunicar con Ollama en ${host}. Asegúrate de que Ollama está ejecutándose y tiene configurado OLLAMA_ORIGINS="*"`;
            }
        }

        /* --- AUDIO & TTS ENGINE --- */
        function speakText(text) {
            if (!synth) return;
            synth.cancel(); // Stop prior audio

            // Clean markdown formatting symbols for smooth reading
            const cleanText = text.replace(/[*_#`~]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 0.95;

            // Set Spanish Voice if available
            const voices = synth.getVoices();
            const esVoice = voices.find(v => v.lang.startsWith('es'));
            if (esVoice) utterance.voice = esVoice;

            // Visualizer animation
            const bars = document.querySelectorAll('.bar');
            utterance.onstart = () => bars.forEach(b => b.classList.add('active'));
            utterance.onend = () => bars.forEach(b => b.classList.remove('active'));
            utterance.onerror = () => bars.forEach(b => b.classList.remove('active'));

            synth.speak(utterance);
        }

        function toggleTTS() {
            ttsEnabled = !ttsEnabled;
            const btn = document.getElementById('ttsBtn');
            btn.classList.toggle('active', ttsEnabled);
            if (!ttsEnabled && synth) synth.cancel();
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                processUserQuery();
            };

            recognition.onend = () => {
                isRecognizing = false;
                document.getElementById('micBtn').classList.remove('active');
            };
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                alert('Tu navegador no soporta Reconocimiento de Voz.');
                return;
            }

            if (isRecognizing) {
                recognition.stop();
            } else {
                recognition.start();
                isRecognizing = true;
                document.getElementById('micBtn').classList.add('active');
            }
        }

        /* --- PERSISTENT MEMORY MANAGEMENT --- */
        function saveMemory() {
            localStorage.setItem('arthur_conversation_memory', JSON.stringify(conversationHistory));
            updateMemoryCounter();
        }

        function loadMemory() {
            const saved = localStorage.getItem('arthur_conversation_memory');
            if (saved) {
                try {
                    conversationHistory = JSON.parse(saved);
                    conversationHistory.forEach(msg => {
                        appendMessage(msg.role === 'user' ? 'user' : 'arthur', msg.content, false);
                    });
                } catch (e) {
                    conversationHistory = [];
                }
            }
            updateMemoryCounter();
        }

        function clearMemory() {
            if (confirm('¿Deseas reiniciar la memoria conversacional de ARTHUR?')) {
                conversationHistory = [];
                localStorage.removeItem('arthur_conversation_memory');
                document.getElementById('messagesContainer').innerHTML = '';
                appendMessage('arthur', 'Memoria reiniciada. Matriz cognitiva limpia.');
                updateMemoryCounter();
            }
        }

        function updateMemoryCounter() {
            document.getElementById('memoryCount').textContent = `${conversationHistory.length} interacciones`;
        }

        /* --- UI HELPERS --- */
        function appendMessage(sender, text) {
            const container = document.getElementById('messagesContainer');
            const msgEl = createMessageElement(sender, text);
            container.appendChild(msgEl);
            scrollToBottom();
        }

        function createMessageElement(sender, text = '') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            if (sender === 'arthur') {
                const nameDiv = document.createElement('div');
                nameDiv.className = 'agent-name';
                nameDiv.innerHTML = `<span>⚡</span> ARTHUR AI`;
                msgDiv.appendChild(nameDiv);
            }

            if (text) {
                const textDiv = document.createElement('div');
                textDiv.innerText = text;
                msgDiv.appendChild(textDiv);
            }

            return msgDiv;
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                processUserQuery();
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
